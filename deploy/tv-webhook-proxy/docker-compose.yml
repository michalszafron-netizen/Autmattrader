services:
  tv-webhook-proxy:
    image: nginx:alpine
    container_name: tv-webhook-proxy
    restart: unless-stopped
    networks:
      - root_default
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.routers.tvwebhook.rule=Host(`tv.prawosfera.online`)"
      - "traefik.http.routers.tvwebhook.entrypoints=web,websecure"
      - "traefik.http.routers.tvwebhook.tls=true"
      - "traefik.http.routers.tvwebhook.tls.certresolver=mytlschallenge"
      - "traefik.http.services.tvwebhook.loadbalancer.server.port=80"

networks:
  root_default:
    external: true
